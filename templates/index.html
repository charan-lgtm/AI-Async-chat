<!Doctype html>
<html>
    <head>
        <title>
            AI-ChatBot
        </title>
        <style>
   body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f8;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Header */
h3 {
    text-align: center;
    padding: 15px;
    margin: 0;
    background: white;
    border-bottom: 1px solid #ddd;
}

/* Chat container */
#output {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* Messages */
.message {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    word-wrap: break-word;
}

/* User message */
.user {
    align-self: flex-end;
    background: #dcf8c6;
}

/* Bot message */
.bot {
    align-self: flex-start;
    background: white;
    border: 1px solid #ddd;
}

/* Input area (ChatGPT style bottom bar) */
.text {
    display: flex;
    padding: 12px;
    background: white;
    border-top: 1px solid #ddd;
    position: sticky;
    bottom: 0;
}

/* Textbox */
textarea {
    flex: 1;
    height: 45px;
    resize: none;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    outline: none;
}

/* Button */
button {
    margin-left: 10px;
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: #10a37f;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0e8f6f;
}
.message {
    white-space: pre-wrap;
}
        </style>
    </head>
    <body>
        <h3>AI ChatBot</h3>
        <div class='text'>
            <textarea id="message" placeholder="Ask Something....."></textarea>
        </div>
        <br><br>
        <button onclick="sendMessage()">Submit</button>
        <div id="output"></div>
        <!-- SocketIO --> 
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
const socket = io("https://ai-async-chat.onrender.com", {
    transports: ["websocket"]
});
const output = document.getElementById("output");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.classList.add("message", type);
    div.textContent = text;   // ✅ IMPORTANT FIX
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById("message");
    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");  // user message
    socket.send(message);

    input.value = "";
}

// bot response
socket.on("response", (data) => {
    addMessage(data, "bot");   // bot message
});
</script>
    </body>
</html>
